name: Build CozyCrazyZones

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Read mod version
        shell: bash
        run: echo "MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_ENV"
      - name: Build reobfuscated Forge jar
        run: gradle build --stacktrace
      - name: Package root overlay
        shell: bash
        run: |
          rm -rf ROOT_OVERLAY
          mkdir -p ROOT_OVERLAY/mods
          cp build/libs/CozyCrazyZones-*.jar ROOT_OVERLAY/mods/
          if [ -d root_overlay ]; then
            cp -R root_overlay/. ROOT_OVERLAY/
          fi
          cd ROOT_OVERLAY
          SAFE_VERSION="${MOD_VERSION//./_}"
          zip -r "../CozyCrazyZones_v${SAFE_VERSION}_ROOT_OVERLAY.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: CozyCrazyZones-v${{ env.MOD_VERSION }}-build
          path: |
            build/libs/CozyCrazyZones-*.jar
            CozyCrazyZones_v*_ROOT_OVERLAY.zip
