name: Build CozyCrazyZones

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build reobfuscated Forge jar
        run: gradle build --stacktrace
      - name: Package root overlay
        shell: bash
        run: |
          mkdir -p ROOT_OVERLAY/mods
          cp build/libs/CozyCrazyZones-*.jar ROOT_OVERLAY/mods/
          cd ROOT_OVERLAY
          zip -r ../CozyCrazyZones_v0_1_ROOT_OVERLAY.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: CozyCrazyZones-v0.1-build
          path: |
            build/libs/CozyCrazyZones-*.jar
            CozyCrazyZones_v0_1_ROOT_OVERLAY.zip
